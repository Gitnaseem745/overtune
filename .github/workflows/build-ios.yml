name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
    tags:
      - 'v*'
      - 'ios-v*'
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (requires tag or release draft)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build & Package Unsigned IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 16.2
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
            echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
            echo "DEVELOPER_DIR=/Applications/Xcode_16.1.app/Contents/Developer" >> $GITHUB_ENV
          fi
          echo "Active Xcode: $(xcode-select -p)"
          xcodebuild -version

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧪 Run Quality Gate (Typecheck & Unit Tests)
        run: |
          npm run typecheck
          npm test

      - name: ⚙️ Run Expo Prebuild (Generate Native /ios)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 🛠️ Install CocoaPods Dependencies & Patch Build Settings
        run: |
          cd ios
          NODE_PATH=$(which node)
          echo "export NODE_BINARY=$NODE_PATH" > .xcode.env.local
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node || true

          # Defense-in-depth: Disable User Script Sandboxing & Swift Explicit Modules across all Pod targets
          ruby -e '
          file = "Podfile"
          if File.exist?(file)
            content = File.read(file)
            patch = %Q{
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"
                    config.build_settings["SWIFT_ENABLE_EXPLICIT_MODULES"] = "NO"
                  end
                end
            }
            if content.include?("react_native_post_install")
              content.sub!("react_native_post_install(", patch + "\n    react_native_post_install(")
              File.write(file, content)
              puts "✅ Successfully patched Podfile post_install settings"
            end
          end
          '
          pod install
          cd ..

      - name: 🧰 Configure Xcode & Resolve Package Dependencies
        run: |
          # 1. Bypass Swift Macro and Plugin fingerprint checks on headless CI
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM -bool YES

          # 2. Clear any stale caches on the runner
          rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData

          # 3. Explicitly resolve Swift package dependencies before compilation
          echo "Resolving Swift package dependencies..."
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Overtone.xcworkspace \
            -scheme Overtone \
            -skipMacroValidation \
            -skipPackagePluginValidation || {
              echo "⚠️ Warning: xcodebuild -resolvePackageDependencies reported warnings/errors, continuing to build..."
            }

      - name: 🔨 Compile Native iOS Binary (Unsigned)
        run: |
          mkdir -p build/DerivedData
          set -o pipefail
          xcodebuild \
            -workspace ios/Overtone.xcworkspace \
            -scheme Overtone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee xcodebuild.log || {
              echo "❌ xcodebuild failed! Extracted build errors:"
              grep -E -C 3 "(error:|fatal error:)" xcodebuild.log | head -n 60 || true
              echo ""
              echo "📋 Tail of build log (last 80 lines):"
              tail -n 80 xcodebuild.log
              exit 1
            }

      - name: 📦 Package App into Overtone_Unsigned.ipa
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "Overtone.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Overtone.app"
          fi
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Error: Compiled Overtone.app not found at $APP_PATH"
            exit 1
          fi

          echo "✅ Found $APP_PATH. Creating IPA Payload..."
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          # Zip Payload into IPA format with symlinks preserved (-y)
          zip -r -y -q ../../Overtone_Unsigned.ipa Payload
          cd ../..

          echo "🎉 Successfully packaged Overtone_Unsigned.ipa:"
          ls -lh Overtone_Unsigned.ipa

      - name: 📤 Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overtone_Unsigned.ipa
          path: mobile/Overtone_Unsigned.ipa
          retention-days: 14

      - name: 🚀 Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: mobile/Overtone_Unsigned.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
