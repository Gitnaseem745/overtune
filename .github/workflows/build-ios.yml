name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
    tags:
      - 'v*'
      - 'ios-v*'
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (requires tag or release draft)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build & Package Unsigned IPA
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧪 Run Quality Gate (Typecheck & Unit Tests)
        run: |
          npm run typecheck
          npm test

      - name: ⚙️ Run Expo Prebuild (Generate Native /ios)
        run: npx expo prebuild --platform ios --clean

      - name: 🛠️ Verify CocoaPods Dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: 🔨 Compile Native iOS Binary (Unsigned)
        run: |
          mkdir -p build/DerivedData
          xcodebuild \
            -workspace ios/Overtone.xcworkspace \
            -scheme Overtone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: 📦 Package App into Overtone_Unsigned.ipa
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Overtone.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Error: Compiled Overtone.app not found at $APP_PATH"
            exit 1
          fi

          echo "✅ Found $APP_PATH. Creating IPA Payload..."
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          # Zip Payload into IPA format with symlinks preserved (-y)
          zip -r -y -q ../../Overtone_Unsigned.ipa Payload
          cd ../..

          echo "🎉 Successfully packaged Overtone_Unsigned.ipa:"
          ls -lh Overtone_Unsigned.ipa

      - name: 📤 Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overtone_Unsigned.ipa
          path: mobile/Overtone_Unsigned.ipa
          retention-days: 14

      - name: 🚀 Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: mobile/Overtone_Unsigned.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
