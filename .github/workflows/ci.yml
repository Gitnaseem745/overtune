name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-ci:
    name: Desktop (Lint, Typecheck, Test, Build)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native dependencies for Electron
        run: npx electron-builder install-app-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Desktop Unit & Integration Tests
        run: npm test

      - name: Build Next.js static export
        run: npm run build:next

      - name: Build Electron main process
        run: npm run build:electron

  mobile-ci:
    name: Mobile (Lint, Typecheck, Test, iOS & Android Export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile ESLint
        run: npm run lint

      - name: Run Mobile TypeScript Typecheck
        run: npm run typecheck

      - name: Run Mobile Unit Tests
        run: npm test

      - name: Build & Export iOS Bundle
        run: npx expo export --platform ios

      - name: Build & Export Android Bundle
        run: npx expo export --platform android
